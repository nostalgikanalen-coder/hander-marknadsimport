name: Hitta adresser till lokaler
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Spara entydiga matchningar i platsregistret
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: venue-lookup
  cancel-in-progress: false
jobs:
  lookup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Hitta adresser
        env:
          SERPER_KEY: ${{ secrets.SERPER_KEY || secrets.SERPAPI_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APPLY: ${{ inputs.apply }}
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          import {cert,initializeApp} from 'firebase-admin/app';
          import {getFirestore} from 'firebase-admin/firestore';

          const account = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || 'null');
          if (account?.project_id !== 'hander-ostergotland') throw new Error('Kontrollera FIREBASE_SERVICE_ACCOUNT.');
          const secret = process.env.SERPER_KEY?.trim();
          if (!secret) throw new Error('Serper-nyckeln saknas.');
          const db = getFirestore(initializeApp({credential:cert(account),projectId:account.project_id}));
          const apply = process.env.APPLY === 'true';
          const norm = value => String(value ?? '').normalize('NFC').toLocaleLowerCase('sv')
            .replace(/[^\p{L}\p{N}]+/gu,' ').trim();
          const key = (name,town) => norm(town)+'|'+norm(name);
          const registry = db.collection('venueRegistry');
          const [stored,events] = await Promise.all([
            registry.get(), db.collection('events').where('startsAt','>=',new Date()).get()
          ]);
          const known = new Set(stored.docs.flatMap(record=>{
            const {name,municipality,aliases=[]} = record.data();
            return [name,...aliases].map(value=>key(value,municipality));
          }));
          const locations = new Map();
          for (const record of events.docs) {
            const {venueName:name,municipality,hidden,latitude,longitude,address} = record.data();
            if (hidden || !norm(name) || !norm(municipality) || name.length>120 || municipality.length>80) continue;
            const id = key(name,municipality);
            if (known.has(id)) continue;
            const item = locations.get(id) ?? {name,municipality,count:0,verified:new Map()};
            if (address && Number.isFinite(latitude) && Number.isFinite(longitude)
                && Math.abs(latitude)<=90 && Math.abs(longitude)<=180 && address.length<=180) {
              item.verified.set(JSON.stringify([norm(address),latitude,longitude]),{address,latitude,longitude});
            }
            item.count++;
            locations.set(id,item);
          }

          const names = [
            ['norrköping','de geerhallen','louis de geer konsert kongress','louis de geer konsert och kongress'],
            ['motala','folkets hus teatersalongen','folkets hus teater salongen','teatersalongen motala folkets hus','motala folkets hus'],
            ['motala','brunneby musteri borensberg','brunneby musteri'],
            ['linköping','gamla linköpings stadskvarter','gamla linköping'],
            ['norrköping','kolmårdens djurpark','kolmården djurpark']
          ];
          const postalTowns = new Map([
            ['motala',['motala','borensberg','tjällmo']],
            ['norrköping',['norrköping','åby','kolmården','krokek','skärblacka']],
            ['linköping',['linköping','vreta kloster','ljungsbro','sturefors']]
          ]);
          const fixed = new Map([
            ['norrköping|de geerhallen',{address:'Dalsgatan 15',latitude:58.5881726,longitude:16.1842062}],
            ['norrköping|holmentorget',{address:'Holmentorget',latitude:58.5881002,longitude:16.1815537}]
          ]);
          function group(item) {
            return names.find(([town,...variants])=>town===norm(item.municipality) && variants.includes(norm(item.name)));
          }
          function matchingPlaces(places,item) {
            const hits = new Map();
            const town = norm(item.municipality);
            const variants = group(item)?.slice(1) ?? [norm(item.name)];
            for (const place of places) {
              const address = String(place.address ?? '').trim();
              const postalTown = norm(address.match(/\b\d{3}\s?\d{2}\s+([^,]+)/)?.[1]);
              if (!variants.includes(norm(place.title)) || !(postalTowns.get(town) ?? [town]).includes(postalTown)
                || !address || address.length>180
                || !Number.isFinite(place.latitude) || Math.abs(place.latitude)>90
                || !Number.isFinite(place.longitude) || Math.abs(place.longitude)>180) continue;
              const {latitude,longitude} = place;
              hits.set(JSON.stringify([norm(address),latitude,longitude]),{address,latitude,longitude});
            }
            return hits;
          }

          let calls=0, matched=0, saved=0;
          const ordered=[...locations].sort((a,b)=>b[1].count-a[1].count);
          console.log('Lokaler att kontrollera:',ordered.length);
          const checked = new Set(known);
          for (const [id,item] of ordered) {
            const variants=group(item)?.slice(1) ?? [norm(item.name)];
            const keys=variants.map(name=>key(name,item.municipality));
            if (keys.some(value=>checked.has(value))) continue;
            const seed=keys.map(value=>fixed.get(value)).find(Boolean);
            let hits=seed ? new Map([['known',seed]]) : item.verified;
            if (!hits.size) {
              if (calls>=35) { console.log('Sökgränsen för körningen är nådd.'); break; }
              calls++;
              const response=await fetch('https://google.serper.dev/places',{
                method:'POST',headers:{'X-API-KEY':secret,'Content-Type':'application/json'},
                body:JSON.stringify({q:item.name+', '+item.municipality+', Sverige',gl:'se',hl:'sv'}),
                signal:AbortSignal.timeout(10000)
              });
              if (!response.ok) throw new Error('Serper HTTP '+response.status);
              const data=await response.json();
              if (!Array.isArray(data.places)) {
                if (data.error) throw new Error('Serper rapporterade ett fel.');
                data.places=[];
              }
              hits=matchingPlaces(data.places,item);
            }
            if (hits.size!==1) {
              console.log('Hoppar över:',JSON.stringify({plats:item.name,kommun:item.municipality,matchningar:hits.size}));
              continue;
            }
            const result={name:item.name,municipality:item.municipality,aliases:variants.filter(name=>name!==norm(item.name)),...[...hits.values()][0]};
            for (const value of keys) checked.add(value);
            matched++;
            console.log('Matchning:',JSON.stringify(result));
            if (!apply) continue;
            const ref=registry.doc('auto-'+createHash('sha256').update(id).digest('hex').slice(0,32));
            const added=await db.runTransaction(async tx=>{
              const current=await tx.get(registry);
              if (current.docs.some(record=>{
                const entry=record.data();
                return [entry.name,...(entry.aliases ?? [])].some(name=>keys.includes(key(name,entry.municipality)));
              })) return false;
              tx.create(ref,result);
              return true;
            });
            if (added) saved++;
          }
          console.log('Matchningar:',matched,'| Sparade:',saved,'| Serper-anrop:',calls);
          JS
