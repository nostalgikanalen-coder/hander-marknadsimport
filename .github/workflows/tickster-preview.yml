name: Förhandsgranska Tickster
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      importera:
        description: Spara nya evenemang och uppdateringar i Firestore
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tickster-import
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: |
          if [ "$IMPORTERA" = true ]; then
            node tickster-preview.js --apply
          else
            node tickster-preview.js
          fi
        env:
          IMPORTERA: ${{ github.event_name == 'schedule' || inputs.importera }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
